services:
  nginx:
    image: docker.io/library/nginx:1.26.3
    depends_on:
      - web
    ports:
      - 2090:80
    restart: unless-stopped
    volumes:
      - browser-static:/static
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/slsfi/jansson-frontend:1.6.2-dev.3
    restart: unless-stopped
    volumes:
      - browser-static:/digital-edition-frontend-ng/dist/app/browser
volumes:
  browser-static:
